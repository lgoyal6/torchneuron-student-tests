name: model-fallbacks
on: [push, workflow_dispatch]
env:
  NEURON_PLATFORM_TARGET_OVERRIDE: trn2
  NEURON_LOGICAL_NC_CONFIG: "2"
  NEURON_RT_FAKE_INSTANCE_TYPE: trn2.48xlarge
jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container: ubuntu:26.04
    env:
      PATH: /tmp/venv/bin:/opt/aws/neuron/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - run: apt-get update -qq && apt-get install -y -qq git ca-certificates libarchive13t64 >/dev/null
      - uses: actions/checkout@v4
      - run: bash probes/install.sh pip-only && bash probes/install.sh runtime && pip install -q transformers
      - run: python probes/model_fallbacks.py 2>&1 | grep -E "^MODEL|Traceback|Error" | grep -v "NRT:" | cut -c1-600
