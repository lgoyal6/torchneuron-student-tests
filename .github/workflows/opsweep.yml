name: op-sweep
on: [push, workflow_dispatch]
env:
  NEURON_PLATFORM_TARGET_OVERRIDE: trn2
  NEURON_LOGICAL_NC_CONFIG: "2"
  NEURON_RT_FAKE_INSTANCE_TYPE: trn2.48xlarge
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container: ubuntu:26.04
    env:
      PATH: /tmp/venv/bin:/opt/aws/neuron/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - run: apt-get update -qq && apt-get install -y -qq git ca-certificates libarchive13t64 >/dev/null
      - uses: actions/checkout@v4
      - run: bash probes/install.sh pip-only && bash probes/install.sh runtime
      - run: git clone -q --depth 1 https://github.com/aws-neuron/torch-neuronx.git /tmp/r && git -C /tmp/r log --oneline -1
      - name: op sweep
        run: timeout 17000 python probes/op_sweep.py /tmp/r/docs/torch_api_compatibility.md > /tmp/sweep.log 2>&1; echo "exit=$?"; grep -E "^(SUMMARY|MISMATCH)" /tmp/sweep.log
      - name: full rows
        if: always()
        run: grep -E "^ROW" /tmp/sweep.log | cut -c1-260 || true
